name: android

# NOTE: the "on" key MUST be quoted. PyYAML (and other YAML 1.1 parsers)
# interprets the unquoted word `on:` as the boolean True; GitHub Actions'
# custom loader usually tolerates this, but some API endpoints (e.g.
# workflow_dispatch) reject the trigger key when it's parsed as a boolean.
# Quoting forces string interpretation everywhere.
"on":
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

# HARD RULE (owner decree, M3 push): every push must leave main GREEN.
# The workflow below runs:
#   1. ktlintCheck        — code style across ALL Kotlin sources
#   2. detekt             — static analysis across ALL Kotlin sources
#   3. vault-guard        — CI guard: no user-auth/biometric binding on vault key
#   4. byte-array-key-guard — structural guard: no ByteArray-as-HashMap-key
#                              (referential equals bug family)
#   5. JVM tests          — :core:protocol, :core:crypto, :core:domain, :relay, :transport:websocket
#   6. Robolectric tests  — :core:data (Room + SQLCipher + Keystore vault)
#
# assembleDebug is NOT in CI yet — the Android UI modules (:app, :feature:chat)
# have no real source until M5. Adding assembleDebug now would force CI red
# for unrelated reasons. M5 will extend the command to add assembleDebug.
#
# Each future module push EXTENDS the CI command:
#   M3   = ktlint + detekt + vaultGuard + byteArrayKeyGuard + JVM tests + Robolectric
#   M4a  = + :relay:test (relay integration tests)
#   M4b  = + :transport:websocket:test (Ktor client + reconnect backoff)
#   M4c  = + :testing:e2e:test (end-to-end JVM: two CryptoEngines + in-process relay)
#   pkg  = + assemble packages (6 JVM jars + 1 Android aar) uploaded as artifact
#   M5+  = + assembleDebug (for :app/:feature:chat Android UI) + :app/:feature tests
#
# ARCHITECTURE NOTE: this repo's git root contains the `drs-chat/` project as
# a SUBDIRECTORY (not at the root). All `run:` step paths are relative to
# `drs-chat/` via the job-level `defaults.run.working-directory` directive.
# Action steps (`uses: ...`) ignore this directive; they run at the git root
# and only matter where they read/write repo files — `actions/cache@v4` and
# `actions/upload-artifact@v4` paths below account for that.
jobs:
  build:
    name: ktlint + detekt + guards + tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: drs-chat
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '21' }
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with: { packages: 'platforms;android-36 build-tools;35.0.0' }
      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/libs.versions.toml', '**/*.gradle.kts') }}
          restore-keys: gradle-${{ runner.os }}-
      - name: Make guard scripts executable
        run: chmod +x scripts/vault-guard.sh scripts/byte-array-key-guard.sh
      - name: ktlint
        working-directory: drs-chat/android
        run: ./gradlew --no-daemon --stacktrace ktlintCheck
      - name: detekt
        working-directory: drs-chat/android
        run: ./gradlew --no-daemon --stacktrace detekt
      - name: vault-guard (Keystore vault policy)
        run: ./scripts/vault-guard.sh
      - name: byte-array-key-guard (ByteArray-as-key bug family)
        run: ./scripts/byte-array-key-guard.sh
      - name: JVM tests (protocol, crypto, domain, relay, transport)
        working-directory: drs-chat/android
        run: ./gradlew --no-daemon --stacktrace :core:protocol:test :core:crypto:test :core:domain:test :relay:test :transport:websocket:test
      - name: Robolectric tests (data — Room + SQLCipher + vault)
        working-directory: drs-chat/android
        run: ./gradlew --no-daemon --stacktrace :core:data:test
      - name: Assemble packages (jar + aar)
        working-directory: drs-chat/android
        run: |
          ./gradlew --no-daemon --stacktrace \
            :core:protocol:jar :core:domain:jar :core:crypto:jar \
            :transport:api:jar :transport:websocket:jar \
            :relay:jar \
            :core:data:assembleDebug
      - name: Upload build packages
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-packages
          path: |
            drs-chat/android/core/protocol/build/libs/*.jar
            drs-chat/android/core/domain/build/libs/*.jar
            drs-chat/android/core/crypto/build/libs/*.jar
            drs-chat/android/transport/api/build/libs/*.jar
            drs-chat/android/transport/websocket/build/libs/*.jar
            drs-chat/server/relay/build/libs/*.jar
            drs-chat/android/core/data/build/outputs/aar/*.aar
          if-no-files-found: error
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            drs-chat/android/**/build/test-results/**/*.xml
            drs-chat/android/**/build/reports/**
            drs-chat/scripts/
          if-no-files-found: ignore
