name: android

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  build:
    name: Build, lint, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '21' }
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with: { packages: 'platforms;android-35 build-tools;35.0.0' }
      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/libs.versions.toml', '**/*.gradle.kts') }}
          restore-keys: gradle-${{ runner.os }}-
      - name: ktlint + detekt + tests + assembleDebug
        working-directory: android
        run: ./gradlew --no-daemon --stacktrace ktlintCheck detekt test assembleDebug
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            android/**/build/test-results/**/*.xml
            android/**/build/reports/detekt/**
          if-no-files-found: ignore
