complexity:
  LongParameterList:
    active: false
  LongMethod:
    active: true
    threshold: 100
  ComplexCondition:
    active: true
    threshold: 5
  CyclomaticComplexMethod:
    active: true
    threshold: 20
  NestedBlockDepth:
    active: true
    threshold: 5

style:
  MaxLineLength:
    active: true
    maxLineLength: 140
    excludePackageStatements: true
    excludeImportStatements: true
  MagicNumber:
    active: false
  ReturnCount:
    active: false
  WildcardImport:
    active: false
  ThrowsCount:
    active: false
  LoopWithTooManyJumpStatements:
    active: false

naming:
  # FunctionNaming is disabled project-wide — clashes with Compose PascalCase
  # composable functions and there's no clean per-package exception that
  # detekt 1.23.7 honors. ktlint's equivalent rule was disabled for the
  # same reason (see .editorconfig ktlint_standard_function-naming=disabled).
  FunctionNaming:
    active: false
  MatchingDeclarationName:
    active: false

exceptions:
  TooGenericExceptionCaught:
    active: false
  SwallowedException:
    active: true
